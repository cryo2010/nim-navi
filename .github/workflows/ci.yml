name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mm: [orc, arc]
    name: tests (--mm:${{ matrix.mm }})
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Only needed for the navi/chronos entry and its test.
      - name: Install chronos
        run: nimble install -y "chronos@>= 4.0.0"

      # navi's only required Nim dependency (MD5 for Digest auth).
      - name: Install checksums
        run: nimble install -y checksums

      # Runtime libs for the br/zstd decompression tests (loaded via dynlib).
      - name: Install brotli/zstd
        run: sudo apt-get update && sudo apt-get install -y libbrotli1 libzstd1

      # Run the suite directly (not `nimble test`): nimble does not reliably
      # propagate a task's exit code (nim-lang/nimble#1802), so a failing suite
      # under `nimble test` can pass CI. tests/run.sh runs `nim c -r` per suite
      # under `set -e`, so a failure fails the job.
      - name: Run tests
        run: bash tests/run.sh
        env:
          NAVI_MM: ${{ matrix.mm }}

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mm: [orc, arc]
    name: compile entries (--mm:${{ matrix.mm }}, -d:ssl)
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Only needed for the navi/chronos entry.
      - name: Install chronos
        run: nimble install -y "chronos@>= 4.0.0"

      # This job runs raw `nim check`, so navi's `requires` (checksums, for
      # Digest auth's MD5) aren't auto-resolved the way a nimble task resolves
      # them; install it explicitly.
      - name: Install checksums
        run: nimble install -y checksums

      # Compiles each backend entry with -d:ssl, exercising the OpenSSL/ALPN path
      # that the (plain-TCP) test suite never builds, under both memory managers.
      - name: Compile entry modules
        run: |
          for entry in navi navi/asyncdispatch navi/chronos; do
            echo "== $entry =="
            nim check --mm:${{ matrix.mm }} -d:ssl --path:src --hints:off "src/$entry.nim"
          done

  compile-js:
    runs-on: ubuntu-latest
    name: compile navi/js (nim js)
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The js entry is guarded to the JavaScript backend, so it must be built
      # with `nim js`; this is the only CI job that compiles it.
      - name: Compile the JavaScript backend
        run: nim js --path:src --hints:off -o:navi_js.js src/navi/js.nim

      # Node 22+ has a global WebSocket; run the navi/js WebSocket client under it
      # against a native echo server (the only runtime test of the js backend).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install checksums
        run: nimble install -y checksums   # the native echo server pulls in proto/ws

      # navi/asyncdispatch and navi/chronos fall back to navi/js under `nim js`,
      # so a library written on either must compile for the browser/Node too
      # (no chronos package needed on this target).
      - name: Compile the js fallback (asyncdispatch/chronos -> navi/js)
        run: |
          nim js --path:src --hints:off -o:js_fallback_async.js  tests/js_fallback_async.nim
          nim js --path:src --hints:off -o:js_fallback_chronos.js tests/js_fallback_chronos.nim

      # Run the script directly (not `nimble wsjs`): nimble does not propagate a
      # task's exit code (nim-lang/nimble#1802). jsws.sh uses `set -e`.
      - name: navi/js WebSocket runtime test
        run: bash tests/interop/jsws.sh

      # Cookie jar + middleware under Node. Guards the runtime navi/js middleware
      # path (a value-object client miscompiled via unsafeAddr under nim js).
      - name: navi/js cookie jar + middleware runtime test
        run: bash tests/interop/js_cookiejar.sh

  sanitize:
    runs-on: ubuntu-latest
    name: sanitizers (asan + ubsan)
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Only needed for the navi/chronos entry and its test.
      - name: Install chronos
        run: nimble install -y "chronos@>= 4.0.0"

      # navi's only required Nim dependency (MD5 for Digest auth).
      - name: Install checksums
        run: nimble install -y checksums

      # Rebuilds and runs the whole suite under AddressSanitizer + UBSan
      # (NAVI_SANITIZE=1, see tests/run.sh). Catches heap overflows,
      # use-after-free, and undefined behavior in the sans-io parsers and buffer
      # handling that a passing test would otherwise hide. Leak detection is off:
      # short-lived test processes leak by design (no teardown), and it is not
      # what this job is looking for.
      - name: Install brotli/zstd
        run: sudo apt-get update && sudo apt-get install -y libbrotli1 libzstd1

      - name: Run tests under ASan/UBSan
        run: bash tests/run.sh
        env:
          NAVI_MM: orc
          NAVI_SANITIZE: "1"
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  interop:
    runs-on: ubuntu-latest
    name: nghttpd interop (http/2)
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # navi's only required Nim dependency (MD5 for Digest auth); the interop
      # tests build navi via raw `nim` inside run.sh.
      - name: Install checksums
        run: nimble install -y checksums

      # nghttpd (the nghttp2 reference server) validates navi's HPACK encoder,
      # ALPN, real h2 framing, multiplexing, and receive-side flow control.
      - name: Install nghttpd
        run: sudo apt-get update && sudo apt-get install -y nghttp2-server

      # Only the chronos leg of the Happy Eyeballs test needs the chronos package.
      - name: Install chronos
        run: nimble install -y "chronos@>= 4.0.0"

      # Scripts run directly (not `nimble interop`/`nimble mtls`): nimble does not
      # propagate a task's exit code (nim-lang/nimble#1802). Both use `set -e`.
      - name: Run the interop suite
        run: bash tests/interop/run.sh

      # Mutual-TLS: an OpenSSL server that requires a client certificate,
      # validating TlsConfig.certFile/keyFile on the sync (OpenSSL) backend.
      - name: Run the mTLS interop test
        run: bash tests/interop/mtls.sh

      # Handshake-aware address fallback: a dead endpoint plus a good TLS server
      # on one port; navi must fall through to the good address. python3 (present
      # on the runner) stands up the two servers.
      - name: Run the TLS address-fallback test
        run: bash tests/interop/tls_fallback.sh

      # TLS version pinning: openssl s_server pinned to TLS 1.2 and to TLS 1.3;
      # navi's minVersion/maxVersion must reject the excluded version. Needs an
      # openssl that speaks TLS 1.3 (the runner's OpenSSL 3 does).
      - name: Run the TLS version-pinning test
        run: bash tests/interop/tls_version.sh

      # Happy Eyeballs (RFC 8305): a blackholed first address (192.0.2.1, SYN
      # dropped) plus a good server; navi must race the addresses and reach the
      # good one in ~the attempt delay instead of stalling on the blackhole.
      - name: Run the Happy Eyeballs test
        run: bash tests/interop/happy_eyeballs.sh

      # Cipher-suite selection: servers pinned to a single TLS 1.2 cipher and a
      # single TLS 1.3 ciphersuite; navi's ciphers/cipherSuites must be honored.
      - name: Run the cipher-suite selection test
        run: bash tests/interop/cipher_suite.sh

      # Private-CA verification: a server cert signed by a throwaway CA; navi
      # must verify it against TlsConfig.caFile and reject the same server when
      # it falls back to the system trust store (which lacks that CA).
      - name: Run the private-CA verification test
        run: bash tests/interop/ca_verify.sh

  streaming:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proto: [http1, http2]
        dir: [upload, download]
    name: file streaming (${{ matrix.proto }} ${{ matrix.dir }})
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install checksums
        run: nimble install -y checksums

      # http/2 uses nghttpd; http/1.1 uses a local Nim server. Installing nghttpd
      # for both keeps the step uniform.
      - name: Install nghttpd
        run: sudo apt-get update && sudo apt-get install -y nghttp2-server

      # Streams a 3 MiB file over the matrix protocol/direction and asserts the
      # transfer used that protocol and the bytes hash-match the original.
      - name: Run the file-streaming check
        run: bash tests/interop/streaming.sh ${{ matrix.proto }} ${{ matrix.dir }}

  multiserver:
    runs-on: ubuntu-latest
    name: multi-server interop (nginx/caddy/h2o)
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install checksums
        run: nimble install -y checksums

      # Only needed for the navi/chronos entry (the h1+TLS leg of the suite).
      - name: Install chronos
        run: nimble install -y "chronos@>= 4.0.0"

      # nghttpd covers the nghttp2 reference; this runs navi's h2 client against
      # three unrelated stacks (nginx, Caddy/Go net/http2, h2o) plus the h1+TLS
      # path via chronos. All in containers, so it is offline and reproducible.
      # Docker Compose ships on the ubuntu-latest runner.
      - name: Run the multi-server interop suite
        run: bash tests/interop/servers.sh

  httpbin:
    runs-on: ubuntu-latest
    name: httpbin interop (behind Caddy)
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # checksums provides the MD5 used by digest auth (exercised by this suite).
      - name: Install checksums
        run: nimble install -y checksums

      # Only needed for the navi/chronos leg (the h1+TLS backend).
      - name: Install chronos
        run: nimble install -y "chronos@>= 4.0.0"

      # Node runs the navi/js leg (global fetch); libbrotlidec lets the native
      # brotli-decompression check run for real (it skips cleanly without it).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install brotli runtime
        run: sudo apt-get update && sudo apt-get install -y libbrotli1

      # A local httpbin (kennethreitz/httpbin) fronted by Caddy for TLS+h2, run
      # across all four navi backends (sync, asyncdispatch, chronos, js). Covers
      # every request method plus bodies, auth, redirects, decompression, cookies,
      # and streaming. Offline: httpbin is never published to the host.
      - name: Run the httpbin interop suite
        run: bash tests/interop/httpbin.sh

  sse:
    runs-on: ubuntu-latest
    name: SSE reconnect interop
    steps:
      - uses: actions/checkout@v4

      # Fully Dockerized: a FastAPI SSE server plus a navi/asyncdispatch client
      # compiled inside the image, so no Nim toolchain is needed on the runner
      # (Docker Compose ships on ubuntu-latest). The server drops the connection
      # after every 3 events; the client must reconnect and resume from
      # Last-Event-ID to receive all 10 in order over the h2 mux.
      - name: Run the SSE reconnect interop
        run: >
          docker compose -f tests/interop/sse/docker-compose.yml
          up --build --abort-on-container-exit --exit-code-from client

      - name: Tear down
        if: always()
        run: docker compose -f tests/interop/sse/docker-compose.yml down

  leak:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mm: [orc, arc]
    name: leak check (--mm:${{ matrix.mm }})
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # navi's only required Nim dependency (MD5 for Digest auth).
      - name: Install checksums
        run: nimble install -y checksums

      # Exercises every verb + request 100,000x (800k requests) against an
      # in-process keep-alive server and asserts the Nim heap stays flat. Run
      # under both managers: an orc/arc growth gap would mean a reference cycle.
      # Run directly (not `nimble leak`): nimble does not propagate a task's exit
      # code (nim-lang/nimble#1802), so a growing heap could pass CI.
      - name: Run the leak check
        run: nim c -r -d:release --hints:off --mm:${{ matrix.mm }} tests/leak.nim

  valgrind:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mm: [orc, arc]
    name: valgrind leak check (TLS client, --mm:${{ matrix.mm }})
    steps:
      - uses: actions/checkout@v4

      # Runs navi's HTTPS request loop under Valgrind memcheck (via the Docker
      # image, so the run matches local `nimble valgrind`) and fails on any
      # definite/indirect leak -- e.g. the per-connection SSL_CTX that
      # getOccupiedMem and LeakSanitizer don't catch. Run under both managers:
      # arc does not collect reference cycles, so a cycle leak the orc run hides
      # surfaces here.
      - name: Build and run the Valgrind leak check
        run: |
          docker build -f tests/valgrind/Dockerfile -t navi-valgrind .
          docker run --rm -e NAVI_MM=${{ matrix.mm }} navi-valgrind

  leak-sanitize:
    runs-on: ubuntu-latest
    name: leak check (codec FFI, LeakSanitizer)
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.10"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # clang provides the ASan/LeakSanitizer runtime; the codec libs are dlopened.
      - name: Install clang + brotli/zstd
        run: sudo apt-get update && sudo apt-get install -y clang libbrotli1 libzstd1

      # LeakSanitizer sees what getOccupiedMem cannot: zlib/brotli/zstd contexts
      # that a dropped defer/=destroy would leak. detect_leaks=1 is the Linux
      # default under ASan, set explicitly for clarity.
      # Run directly (not `nimble leakSanitize`): nimble does not propagate a
      # task's exit code (nim-lang/nimble#1802), so a LeakSanitizer failure could
      # pass CI.
      - name: Run the codec leak check
        run: nim c -r --mm:orc -d:useMalloc --hints:off --passC:-fsanitize=address --passL:-fsanitize=address tests/leak_sanitize.nim
        env:
          ASAN_OPTIONS: detect_leaks=1

  # --- Per-scenario, per-target leak-check matrix -------------------------------
  # Builds one Docker image (native Valgrind + ASan/UBSan, plus a Node heap/fd
  # check for the js backend) and runs every valid scenario x target cell of
  # new_ci_checks.txt against a local FastAPI server. Applied decisions: navi does
  # h2 only over TLS+ALPN, so http2-plaintext cells are dropped and chronos
  # (BearSSL, h1-only) is excluded from the pure-h2 GET but still runs the
  # streaming/sse scenarios over h1+TLS; js compiles to JavaScript, which Valgrind/
  # ASan cannot instrument, so it gets a Node heap/fd leak check instead.
  leak-matrix-image:
    runs-on: ubuntu-latest
    name: leak matrix (build image)
    steps:
      - uses: actions/checkout@v4
      - name: Build the leak-check image and save it as an artifact
        run: |
          docker build -f tests/leakcheck/Dockerfile -t navi-leakcheck .
          docker save navi-leakcheck | gzip > /tmp/navi-leakcheck.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: navi-leakcheck-image
          path: /tmp/navi-leakcheck.tar.gz
          retention-days: 1

  leak-matrix:
    needs: leak-matrix-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: valgrind / http1 (plaintext) / sync / orc
            run: valgrind sync http1
          - name: valgrind / http1 (plaintext) / asyncdispatch / orc
            run: valgrind asyncdispatch http1
          - name: valgrind / http1 (plaintext) / chronos / orc
            run: valgrind chronos http1
          - name: valgrind / http1 (TLS) / sync / orc
            run: valgrind sync http1s
          - name: valgrind / http1 (TLS) / asyncdispatch / orc
            run: valgrind asyncdispatch http1s
          - name: valgrind / http1 (TLS) / chronos / orc
            run: valgrind chronos http1s
          - name: valgrind / http2 (TLS) / sync / orc
            run: valgrind sync http2s
          - name: valgrind / http2 (TLS) / asyncdispatch / orc
            run: valgrind asyncdispatch http2s
          - name: valgrind / http2 stream up (TLS) / sync / orc
            run: valgrind sync streamup
          - name: valgrind / http2 stream up (TLS) / asyncdispatch / orc
            run: valgrind asyncdispatch streamup
          - name: valgrind / http2 stream up (TLS) / chronos / orc
            run: valgrind chronos streamup
          - name: valgrind / http2c stream up (TLS) / sync / orc
            run: valgrind sync streamupc
          - name: valgrind / http2c stream up (TLS) / asyncdispatch / orc
            run: valgrind asyncdispatch streamupc
          - name: valgrind / http2c stream up (TLS) / chronos / orc
            run: valgrind chronos streamupc
          - name: valgrind / http2 stream down (TLS) / sync / orc
            run: valgrind sync streamdown
          - name: valgrind / http2 stream down (TLS) / asyncdispatch / orc
            run: valgrind asyncdispatch streamdown
          - name: valgrind / http2 stream down (TLS) / chronos / orc
            run: valgrind chronos streamdown
          - name: valgrind / http2c stream down (TLS) / sync / orc
            run: valgrind sync streamdownc
          - name: valgrind / http2c stream down (TLS) / asyncdispatch / orc
            run: valgrind asyncdispatch streamdownc
          - name: valgrind / http2c stream down (TLS) / chronos / orc
            run: valgrind chronos streamdownc
          - name: valgrind / sse (TLS) / sync / orc
            run: valgrind sync sse
          - name: valgrind / sse (TLS) / asyncdispatch / orc
            run: valgrind asyncdispatch sse
          - name: valgrind / sse (TLS) / chronos / orc
            run: valgrind chronos sse
          - name: valgrind / websocket (plaintext) / sync / orc
            run: valgrind sync ws
          - name: valgrind / websocket (plaintext) / asyncdispatch / orc
            run: valgrind asyncdispatch ws
          - name: valgrind / websocket (plaintext) / chronos / orc
            run: valgrind chronos ws
          - name: valgrind / websocket (TLS) / sync / orc
            run: valgrind sync wss
          - name: valgrind / websocket (TLS) / asyncdispatch / orc
            run: valgrind asyncdispatch wss
          - name: valgrind / websocket (TLS) / chronos / orc
            run: valgrind chronos wss
          - name: sanitize / http1 (plaintext) / sync / orc
            run: sanitize sync http1
          - name: sanitize / http1 (plaintext) / asyncdispatch / orc
            run: sanitize asyncdispatch http1
          - name: sanitize / http1 (plaintext) / chronos / orc
            run: sanitize chronos http1
          - name: sanitize / http1 (TLS) / sync / orc
            run: sanitize sync http1s
          - name: sanitize / http1 (TLS) / asyncdispatch / orc
            run: sanitize asyncdispatch http1s
          - name: sanitize / http1 (TLS) / chronos / orc
            run: sanitize chronos http1s
          - name: sanitize / http2 (TLS) / sync / orc
            run: sanitize sync http2s
          - name: sanitize / http2 (TLS) / asyncdispatch / orc
            run: sanitize asyncdispatch http2s
          - name: sanitize / http2 stream up (TLS) / sync / orc
            run: sanitize sync streamup
          - name: sanitize / http2 stream up (TLS) / asyncdispatch / orc
            run: sanitize asyncdispatch streamup
          - name: sanitize / http2 stream up (TLS) / chronos / orc
            run: sanitize chronos streamup
          - name: sanitize / http2c stream up (TLS) / sync / orc
            run: sanitize sync streamupc
          - name: sanitize / http2c stream up (TLS) / asyncdispatch / orc
            run: sanitize asyncdispatch streamupc
          - name: sanitize / http2c stream up (TLS) / chronos / orc
            run: sanitize chronos streamupc
          - name: sanitize / http2 stream down (TLS) / sync / orc
            run: sanitize sync streamdown
          - name: sanitize / http2 stream down (TLS) / asyncdispatch / orc
            run: sanitize asyncdispatch streamdown
          - name: sanitize / http2 stream down (TLS) / chronos / orc
            run: sanitize chronos streamdown
          - name: sanitize / http2c stream down (TLS) / sync / orc
            run: sanitize sync streamdownc
          - name: sanitize / http2c stream down (TLS) / asyncdispatch / orc
            run: sanitize asyncdispatch streamdownc
          - name: sanitize / http2c stream down (TLS) / chronos / orc
            run: sanitize chronos streamdownc
          - name: sanitize / sse (TLS) / sync / orc
            run: sanitize sync sse
          - name: sanitize / sse (TLS) / asyncdispatch / orc
            run: sanitize asyncdispatch sse
          - name: sanitize / sse (TLS) / chronos / orc
            run: sanitize chronos sse
          - name: sanitize / websocket (plaintext) / sync / orc
            run: sanitize sync ws
          - name: sanitize / websocket (plaintext) / asyncdispatch / orc
            run: sanitize asyncdispatch ws
          - name: sanitize / websocket (plaintext) / chronos / orc
            run: sanitize chronos ws
          - name: sanitize / websocket (TLS) / sync / orc
            run: sanitize sync wss
          - name: sanitize / websocket (TLS) / asyncdispatch / orc
            run: sanitize asyncdispatch wss
          - name: sanitize / websocket (TLS) / chronos / orc
            run: sanitize chronos wss
          - name: js / http1 (plaintext) / js / orc
            run: js http1
          - name: js / http1 (TLS) / js / orc
            run: js http1s
          - name: js / http2 stream down (TLS) / js / orc
            run: js streamdown
          - name: js / http2c stream down (TLS) / js / orc
            run: js streamdownc
          - name: js / sse (TLS) / js / orc
            run: js sse
          - name: js / websocket (plaintext) / js / orc
            run: js ws
          - name: js / websocket (TLS) / js / orc
            run: js wss
    name: ${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: navi-leakcheck-image
          path: /tmp
      - name: Load the leak-check image
        run: docker load < /tmp/navi-leakcheck.tar.gz
      # One cell: build the runner for its target, start the server, and run the
      # scenario under Valgrind (--track-fds catches leaked descriptors) or ASan/
      # UBSan; js cells run the Node heap/fd check. Any leak or sanitizer error
      # fails the cell. navi-owned leaks are fixed, not suppressed.
      - name: ${{ matrix.name }}
        run: docker run --rm navi-leakcheck ${{ matrix.run }}
