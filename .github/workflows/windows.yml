name: windows

# DIAGNOSTIC (ci/diag-sse-cap-windows): only the unit-test job, only
# tests/test_sse_cap.nim, with a progress log dumped afterwards. Not for merge.

on:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mm: [orc]
    name: "windows: tests (--mm:${{ matrix.mm }})"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-navi-windows
        with:
          chronos: "true"
      - name: Install checkmate
        shell: bash
        run: nimble install -y "https://github.com/cryo2010/nim-checkmate"
      - name: Run tests
        shell: bash
        env:
          SSE_CAP_DIAG: ${{ github.workspace }}\sse_cap_diag.log
        run: checkmate --timeout=90 -v --nimflags:"--mm:${{ matrix.mm }}" test_sse_cap
      - name: Dump diagnostic log
        if: always()
        shell: bash
        run: cat "$(cygpath "${{ github.workspace }}\sse_cap_diag.log")" || echo "no log"
