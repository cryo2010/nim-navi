[package]
name = "rust_client"
version = "0.1.0"
edition = "2021"

[dependencies]
# blocking client; rustls avoids an openssl-sys build; gzip enables transparent
# Accept-Encoding + decompression.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "rustls-tls"] }

[profile.release]
opt-level = 3
