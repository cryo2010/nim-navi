# navi needs OpenSSL for https. Applies to everything built in this repo;
# library consumers must likewise compile their app with -d:ssl.
--define:ssl
--path:"src"

@if windows:
  # Nim's default 64-bit DLL list names only the OpenSSL 1.1 pair, which is EOL.
  # Target the 3.x DLLs instead, so the suite, the examples and the interop
  # scripts all build against one library.
  --define:"sslVersion=3-x64"
@end

@if macosx:
  # Link OpenSSL at build time instead of letting std/openssl dlopen it by name.
  # The by-name load resolves to Apple's LibreSSL from the dyld shared cache, and
  # it mixes generations (libssl.48 over libcrypto.46 for the libssl calls,
  # libcrypto.41 for navi's direct libcrypto calls), while Homebrew's OpenSSL 3 is
  # never considered: /opt/homebrew/lib is off dyld's search path on Apple Silicon
  # and SIP strips DYLD_* under `nim c -r`. Linking records the Homebrew path in
  # the binary, so it needs no environment at run time. `sslVersion=3` picks the
  # OpenSSL 3 entry-point names (SSL_get1_peer_certificate). Intel Homebrew lives
  # under /usr/local; MacPorts users override --passL with their own prefix.
  --define:"sslVersion=3"
  --dynlibOverride:"ssl"
  --dynlibOverride:"crypto"
  @if arm64:
    --passL:"-L/opt/homebrew/opt/openssl@3/lib -lssl -lcrypto"
  @else:
    --passL:"-L/usr/local/opt/openssl@3/lib -lssl -lcrypto"
  @end
@end
