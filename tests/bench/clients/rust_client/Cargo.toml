[package]
name = "rust_client"
edition = "2021"
version = "0.1.0"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "rustls-tls", "http2", "stream"] }
futures-util = "0.3"
sha1 = "0.10"
serde_json = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23"

[profile.release]
opt-level = 3
