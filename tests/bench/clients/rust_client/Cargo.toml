[package]
name = "rust_client"
edition = "2021"
version = "0.1.0"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "rustls-tls", "http2"] }

[profile.release]
opt-level = 3
